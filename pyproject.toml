[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "playlist-curator"
version = "1.5.0"
description = "Personal Spotify playlist curator: rebuilds and maintains playlists from your own music crate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - personal use" }
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.50",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
curator = "playlist_curator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/playlist_curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
